apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: seatline
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: seatline
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: seatline-secrets
                  key: POSTGRES_PASSWORD
            - name: INVENTORY_DB_USER
              value: inventory_user
            - name: INVENTORY_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: seatline-secrets
                  key: INVENTORY_DB_PASSWORD
            - name: PAYMENT_DB_USER
              value: payment_user
            - name: PAYMENT_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: seatline-secrets
                  key: PAYMENT_DB_PASSWORD
            - name: NOTIFICATION_DB_USER
              value: notification_user
            - name: NOTIFICATION_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: seatline-secrets
                  key: NOTIFICATION_DB_PASSWORD
            - name: BOOKING_DB_USER
              value: booking_user
            - name: BOOKING_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: seatline-secrets
                  key: BOOKING_DB_PASSWORD
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 3
            periodSeconds: 3
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d/init-db.sh
              subPath: init-db.sh
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-data
        - name: init
          configMap:
            name: postgres-init
            defaultMode: 0755
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: seatline
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
