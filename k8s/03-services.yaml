apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory
  namespace: seatline
spec:
  replicas: 1
  selector:
    matchLabels: {app: inventory}
  template:
    metadata:
      labels: {app: inventory}
    spec:
      containers:
        - name: inventory
          image: seatline-inventory:assignment2
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 8000}]
          env:
            - name: DATABASE_URL
              valueFrom: {secretKeyRef: {name: seatline-secrets, key: INVENTORY_DATABASE_URL}}
          readinessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 300m, memory: 256Mi}
---
apiVersion: v1
kind: Service
metadata: {name: inventory, namespace: seatline}
spec:
  type: NodePort
  selector: {app: inventory}
  ports: [{port: 8000, targetPort: 8000, nodePort: 30081}]
---
