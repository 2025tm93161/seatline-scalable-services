# Optional extra evidence. Requires metrics-server (`minikube addons enable metrics-server`).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: booking
  namespace: seatline
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: booking
  minReplicas: 2
  maxReplicas: 4
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 60
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
