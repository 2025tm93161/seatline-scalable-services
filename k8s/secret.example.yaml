# EXAMPLE ONLY. Do not commit a real Secret with real credentials.
# Recommended: create the actual secret using the kubectl command in KUBERNETES_SETUP.md.
apiVersion: v1
kind: Secret
metadata:
  name: seatline-secrets
  namespace: seatline
type: Opaque
stringData:
  POSTGRES_PASSWORD: change-me
  INVENTORY_DB_PASSWORD: change-me
  PAYMENT_DB_PASSWORD: change-me
  NOTIFICATION_DB_PASSWORD: change-me
  BOOKING_DB_PASSWORD: change-me
  INVENTORY_DATABASE_URL: postgresql+psycopg://inventory_user:change-me@postgres:5432/inventory
  PAYMENT_DATABASE_URL: postgresql+psycopg://payment_user:change-me@postgres:5432/payment
  NOTIFICATION_DATABASE_URL: postgresql+psycopg://notification_user:change-me@postgres:5432/notification
  BOOKING_DATABASE_URL: postgresql+psycopg://booking_user:change-me@postgres:5432/booking
